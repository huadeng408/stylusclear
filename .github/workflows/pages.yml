name: Deploy StylusClear Workbench to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage static workbench files
        run: |
          mkdir -p _site/dist _site/deployments
          cp web/index.html web/app.mjs web/engine-ui.mjs web/benchmarks.generated.mjs web/.nojekyll _site/
          cp web/dist/rpc-client.mjs _site/dist/
          cp web/deployments/*.json _site/deployments/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
