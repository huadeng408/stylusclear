[workspace]
members = [
    "crates/clearing-core",
    "crates/clearing-stylus",
    "crates/clearing-cli",
    "crates/stylus-host-mock",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["huadeng408"]
repository = "https://github.com/huadeng408/stylusclear"

[workspace.dependencies]
alloy-primitives = { version = "=0.8.20", default-features = false }
alloy-sol-types = { version = "=0.8.20", default-features = false }
mini-alloc = "0.8.4"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "alloc"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "z"
